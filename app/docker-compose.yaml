services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: goodman_qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - rag-network

    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/tcp/localhost/6333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goodman_backend
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py

    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333

    depends_on:
      qdrant:
        condition: service_healthy

    networks:
      - rag-network

volumes:
  qdrant_data:
    driver: local

networks:
  rag-network:
    driver: bridge